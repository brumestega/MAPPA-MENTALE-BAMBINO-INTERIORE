<text x="1057" y="788" font-size="12.6" fill="#33291F">Samekh &#8212; Temperanza &#8212; Sagittario</text>
<text x="652" y="806" font-size="12.6" fill="#33291F">Cheth &#8212; Il Carro &#8212; Cancro</text>
<text x="1057" y="806" font-size="12.6" fill="#33291F">Ayin &#8212; Il Diavolo &#8212; Capricorno</text>
<text x="652" y="824" font-size="12.6" fill="#33291F">Teth &#8212; La Forza &#8212; Leone</text>
<text x="1057" y="824" font-size="12.6" fill="#33291F">Tzaddi &#8212; La Stella &#8212; Acquario</text>
<text x="652" y="842" font-size="12.6" fill="#33291F">Yod &#8212; L&#8217;Eremita &#8212; Vergine</text>
<text x="1057" y="842" font-size="12.6" fill="#33291F">Qoph &#8212; La Luna &#8212; Pesci</text>
