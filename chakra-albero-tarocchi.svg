<text x="638" y="918" font-size="12.8" font-weight="bold" fill="#9A5A2A">Nota onesta</text>
<text x="638" y="940" font-size="12.6" fill="#33291F">Le Sephirot non &#8220;sono&#8221; i chakra: l&#8217;accostamento &#8212; e i 22 Arcani sui sentieri &#8212; &#232; una sintesi ermetica</text>
<text x="638" y="959" font-size="12.6" fill="#33291F">moderna (&#201;liphas L&#233;vi, 1800; Golden Dawn, 1888). Bel ponte simbolico, non un&#8217;unica dottrina antica.</text>
