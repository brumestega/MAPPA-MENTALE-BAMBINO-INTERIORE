<text x="652" y="514" font-size="12.6" fill="#33291F">Aleph &#8212; Il Matto &#8212; Aria</text>
<text x="652" y="532" font-size="12.6" fill="#33291F">Mem &#8212; L&#8217;Appeso &#8212; Acqua</text>
<text x="652" y="550" font-size="12.6" fill="#33291F">Shin &#8212; Il Giudizio &#8212; Fuoco</text>
<text x="640" y="576" font-size="13" font-weight="bold" fill="#D99A07">7 DOPPIE &#183; pianeti  (&#8776; i 7 chakra)</text>
<text x="652" y="597" font-size="12.6" fill="#33291F">Beth &#8212; Il Mago &#8212; Mercurio</text>
<text x="652" y="615" font-size="12.6" fill="#33291F">Gimel &#8212; La Papessa &#8212; Luna</text>
<text x="652" y="633" font-size="12.6" fill="#33291F">Daleth &#8212; L&#8217;Imperatrice &#8212; Venere</text>
<text x="652" y="651" font-size="12.6" fill="#33291F">Kaph &#8212; La Ruota &#8212; Giove</text>
<text x="652" y="669" font-size="12.6" fill="#33291F">Peh &#8212; La Torre &#8212; Marte</text>
<text x="652" y="687" font-size="12.6" fill="#33291F">Resh &#8212; Il Sole &#8212; Sole</text>
<text x="652" y="705" font-size="12.6" fill="#33291F">Tav &#8212; Il Mondo &#8212; Saturno</text>
<text x="640" y="731" font-size="13" font-weight="bold" fill="#7E5BBE">12 SEMPLICI &#183; zodiaco</text>
<text x="652" y="752" font-size="12.6" fill="#33291F">He &#8212; L&#8217;Imperatore &#8212; Ariete</text>
<text x="1057" y="752" font-size="12.6" fill="#33291F">Lamed &#8212; La Giustizia &#8212; Bilancia</text>
<text x="652" y="770" font-size="12.6" fill="#33291F">Vav &#8212; Il Papa &#8212; Toro</text>
