<text x="640" y="467" font-size="12.7" fill="#33291F">Ogni sentiero = 1 lettera ebraica = 1 Arcano. Struttura (Sefer Yetzirah): <tspan font-weight="bold">3 + 7 + 12 = 22</tspan>.</text>
