<text x="276" y="798" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff" letter-spacing="0.6">I NUMERI COME SUONO  (tradizione)</text>
<text x="75" y="840" font-size="14.5" fill="#3A2E2A">I petali dei 6 chakra inferiori:</text>
<text x="276" y="865" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E3566" font-family="DejaVu Serif, serif">4 + 6 + 10 + 12 + 16 + 2 = 50</text>
<text x="75" y="890" font-size="14.5" fill="#3A2E2A">le 50 lettere dell&#8217;alfabeto sanscrito</text>
<text x="75" y="913" font-size="14.5" fill="#3A2E2A">(ogni petalo = un suono / una nadi).</text>
<text x="75" y="936" font-size="14.5" fill="#3A2E2A">La Corona le ripete &#215;20 &#8594; 1000 petali.</text>
<text x="75" y="959" font-size="14.5" fill="#3A2E2A">&#200; il legame numero&#8211;suono pi&#249; antico.</text>
<g filter="url(#sh)"><rect x="522" y="772" width="441" height="242" rx="18" fill="#FFFFFF" stroke="#E7D8C5" stroke-width="1.5"/></g>
<rect x="522" y="772" width="441" height="40" rx="18" fill="#3E3566"/>
<rect x="522" y="794" width="441" height="18" fill="#3E3566"/>
<text x="742" y="798" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff" letter-spacing="0.6">IL TUO NUMERO DEL PERCORSO DI VITA</text>
<text x="542" y="840" font-size="14.5" fill="#3A2E2A">Somma le cifre della data di nascita</text>
<text x="542" y="863" font-size="14.5" fill="#3A2E2A">e riducile a una cifra. Esempio:</text>
<text x="742" y="888" text-anchor="middle" font-size="18" font-weight="bold" fill="#3E3566" font-family="DejaVu Serif, serif">14&#183;03&#183;1990 &#8594; 1+4+0+3+1+9+9+0 = 27 &#8594; 9</text>
<text x="542" y="913" font-size="14.5" fill="#3A2E2A">Il numero 1&#8211;7 indica il tuo chakra.</text>
<text x="542" y="936" font-size="14.5" fill="#3A2E2A">8 &#8594; ottava superiore; 9 &#8594; Corona.</text>
<text x="542" y="959" font-size="14.5" fill="#3A2E2A">Maestri 11&#183;22&#183;33 non si riducono</text>
<text x="542" y="982" font-size="14.5" fill="#3A2E2A">(11 Terzo Occhio &#183; 22 Radice+Corona &#183; 33 Cuore).</text>
<g filter="url(#sh)"><rect x="989" y="772" width="441" height="242" rx="18" fill="#FFFFFF" stroke="#E7D8C5" stroke-width="1.5"/></g>
<rect x="989" y="772" width="441" height="40" rx="18" fill="#3E3566"/>
<rect x="989" y="794" width="441" height="18" fill="#3E3566"/>
<text x="1210" y="798" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#ffffff" letter-spacing="0.6">NOTA ONESTA  (fonti)</text>
<text x="1009" y="840" font-size="14.5" fill="#3A2E2A">La corrispondenza numero&#8211;chakra (1&#8211;7) e il</text>
<text x="1009" y="863" font-size="14.5" fill="#3A2E2A">&#171;numero del percorso&#187; sono una sintesi</text>
<text x="1009" y="886" font-size="14.5" fill="#3A2E2A">moderna, non antica &#8212; come i colori</text>
<text x="1009" y="909" font-size="14.5" fill="#3A2E2A">arcobaleno (1977). Tradizione vera:</text>
<text x="1009" y="932" font-size="14.5" fill="#3A2E2A">petali, lettere, bija mantra.</text>
<text x="1009" y="955" font-size="14.5" fill="#3A2E2A">Le &#171;frequenze in Hz&#187; sono recenti: il vero</text>
<text x="1009" y="978" font-size="14.5" fill="#3A2E2A">effetto viene da respiro, suono e mantra.</text>
<text x="742.5" y="1032" text-anchor="middle" font-size="12.5" fill="#9A6234">Sintesi simbolica per il laboratorio &#183; corrispondenza posizionale 1&#8211;7 &#183; per le fonti vedi il report</text>
</svg>